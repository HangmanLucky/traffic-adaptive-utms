  <rect x="820" y="475" width="150" height="80" fill="none" stroke="#eef1f4" stroke-width="1.4"/>
  <text x="895" y="507" fill="#eef1f4" font-size="11" text-anchor="middle" font-weight="700">TRAFFIC HMI</text>
  <text x="895" y="525" fill="#b7bfc7" font-size="9" text-anchor="middle">Intersection map + wait times</text>
  <line x1="820" y1="495" x2="730" y2="420" stroke="#eef1f4" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Title block -->
  <rect x="880" y="600" width="290" height="70" fill="none" stroke="#8d96a0" stroke-width="1"/>
  <text x="895" y="618" fill="#eef1f4" font-size="10">DWG NO: UTMS-ARCH-001</text>
  <text x="895" y="633" fill="#eef1f4" font-size="10">REV: A &#8212; SIMULATION / PORTFOLIO BUILD</text>
  <text x="895" y="648" fill="#eef1f4" font-size="10">AUTHOR: SIPHO LUCKY SIBANDA</text>
  <text x="895" y="663" fill="#b7bfc7" font-size="9">NOT FOR TRAFFIC CABINET DEPLOYMENT</text>
