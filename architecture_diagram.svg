  <text x="600" y="322" fill="#eef1f4" font-size="13" text-anchor="middle" font-weight="700">TRAFFIC CABINET CONTROLLER</text>
  <text x="600" y="340" fill="#b7bfc7" font-size="11" text-anchor="middle">Siemens S7-1500</text>
  <text x="600" y="356" fill="#b7bfc7" font-size="11" text-anchor="middle">FB_Traffic_Intersection_Control</text>
  <text x="600" y="374" fill="#6b7278" font-size="9" text-anchor="middle">Min/max green, gap-out, fairness</text>
  <text x="600" y="390" fill="#6b7278" font-size="9" text-anchor="middle">Ped clearance, EVP preemption</text>
  <text x="600" y="406" fill="#6b7278" font-size="8" text-anchor="middle">(CODESYS-portable ST)</text>

