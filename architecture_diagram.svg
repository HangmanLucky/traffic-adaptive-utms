  <text x="40" y="76" fill="#b7bfc7" font-size="13">Vehicle Loop Sensor Optimization &#8212; Phase Sequencing &amp; Preemption Architecture</text>
  <line x1="40" y1="96" x2="1160" y2="96" stroke="#8d96a0" stroke-width="1"/>

  <!-- 4 approaches -->
  <rect x="60" y="140" width="150" height="80" fill="none" stroke="#4FD1E8" stroke-width="1.6"/>
  <text x="135" y="172" fill="#4FD1E8" font-size="12" text-anchor="middle" font-weight="700">NORTH APPROACH</text>
  <text x="135" y="190" fill="#b7bfc7" font-size="9" text-anchor="middle">Loop detector + EVP</text>

  <rect x="60" y="480" width="150" height="80" fill="none" stroke="#4FD1E8" stroke-width="1.6"/>
  <text x="135" y="512" fill="#4FD1E8" font-size="12" text-anchor="middle" font-weight="700">SOUTH APPROACH</text>
  <text x="135" y="530" fill="#b7bfc7" font-size="9" text-anchor="middle">Loop detector + EVP</text>

  <rect x="990" y="140" width="150" height="80" fill="none" stroke="#4FD1E8" stroke-width="1.6"/>
  <text x="1065" y="172" fill="#4FD1E8" font-size="12" text-anchor="middle" font-weight="700">EAST APPROACH</text>
  <text x="1065" y="190" fill="#b7bfc7" font-size="9" text-anchor="middle">Loop detector + EVP</text>

  <rect x="990" y="480" width="150" height="80" fill="none" stroke="#4FD1E8" stroke-width="1.6"/>
  <text x="1065" y="512" fill="#4FD1E8" font-size="12" text-anchor="middle" font-weight="700">WEST APPROACH</text>
  <text x="1065" y="530" fill="#b7bfc7" font-size="9" text-anchor="middle">Loop detector + EVP</text>

  <!-- Lines to controller -->
  <line x1="210" y1="220" x2="470" y2="310" stroke="#4FD1E8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="210" y1="480" x2="470" y2="400" stroke="#4FD1E8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="990" y1="220" x2="730" y2="310" stroke="#4FD1E8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="990" y1="480" x2="730" y2="400" stroke="#4FD1E8" stroke-width="1.2" stroke-dasharray="4 3"/>

