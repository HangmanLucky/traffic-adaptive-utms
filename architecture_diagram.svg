  <text x="535" y="498" fill="#2ECC71" font-size="11" text-anchor="middle" font-weight="700">NS SIGNAL HEAD</text>
  <text x="535" y="514" fill="#b7bfc7" font-size="9" text-anchor="middle">R / Y / G + WALK</text>
  <line x1="565" y1="430" x2="535" y2="470" stroke="#2ECC71" stroke-width="1.2"/>

  <rect x="600" y="470" width="130" height="70" fill="none" stroke="#FFC107" stroke-width="1.6"/>
