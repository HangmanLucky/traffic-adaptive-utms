<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, Consolas, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1d2024" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="700" fill="#0f1114"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect x="10" y="10" width="1180" height="680" fill="none" stroke="#8d96a0" stroke-width="1.5"/>

